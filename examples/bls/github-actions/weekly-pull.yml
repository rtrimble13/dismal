# Example: pull a few BLS series every Monday morning and commit the results.
# Copy to .github/workflows/ in your own repository and add BLS_API_KEY as a
# repository secret.
name: Weekly BLS pull

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC (after most 08:30 ET releases)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      BLS_FORMAT: csv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dismal
        run: uv tool install git+https://github.com/rtrimble13/dismal
      - name: Check the API
        run: dismal bls doctor
      - name: Pull data
        run: |
          mkdir -p data
          dismal bls data --series-file series-ids.txt --years 5 --strict --output data/bls_long.csv
          dismal bls data --series-file series-ids.txt --years 5 --layout wide --output data/bls_wide.csv
          dismal bls data --series-file series-ids.txt --years 5 --format parquet --output data/bls.parquet
          dismal bls latest --series-file series-ids.txt --catalog --format json --output data/latest.json
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no changes" || git commit -m "data: weekly BLS pull $(date -u +%F)"
          git push
