[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "dismal"
dynamic = ["version"]
description = "One command-line client for U.S. economic data: BLS, BEA and FRED"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "rtrimble13" }]
keywords = [
  "economics", "cli", "api", "time series",
  "bls", "bureau of labor statistics", "cpi", "unemployment",
  "bea", "bureau of economic analysis", "gdp", "nipa", "personal income",
  "fred", "federal reserve", "st. louis fed", "interest rates",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "rapidfuzz>=3.0",
  "pyarrow>=15.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.10",
  "ruff>=0.5",
  "build>=1.2",
]

[project.scripts]
dismal = "dismal.cli:main"

[project.urls]
Homepage = "https://github.com/rtrimble13/dismal"
Documentation = "https://github.com/rtrimble13/dismal/tree/main/docs"
Repository = "https://github.com/rtrimble13/dismal"
Issues = "https://github.com/rtrimble13/dismal/issues"
Changelog = "https://github.com/rtrimble13/dismal/blob/main/CHANGELOG.md"

# --- Versioning -------------------------------------------------------------
# The version is derived from git tags of the form vX.Y.Z (see docs/adr/0006).
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/dismal/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dismal"]

[tool.hatch.build.targets.sdist]
include = ["src/dismal", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

# --- Tooling ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "N", "PL"]
ignore = [
  "PLR0913",  # many arguments are natural for CLI commands
  "PLR0912",  # branches
  "PLR0911",  # returns
  "PLR2004",  # magic values
  "RUF012",   # mutable class attrs (typer models)
  "PLR0915",  # statements
  "PLR0917",  # positional arguments (CLI command signatures)
  "PLC0415",  # lazy imports keep pyarrow/rich off the hot path
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/dismal"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dismal._version"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:dismal.*"]

[tool.coverage.run]
source = ["dismal"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
